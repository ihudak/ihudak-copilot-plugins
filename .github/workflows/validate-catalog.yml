name: Validate plugin catalog

# Guards the marketplace catalog and every plugin manifest in this repository.
#
# The failure this exists to prevent: GitHub Copilot CLI rejects a marketplace
# whose plugins[i].description exceeds 1024 characters, and it rejects the
# entire catalog -- so one over-long blurb makes EVERY plugin in the
# marketplace fail to install or update. Claude Code enforces no such limit,
# which is precisely why it kept shipping: the Claude editions grew past the
# limit with no local symptom, and the Copilot edition inherited the overflow
# at port time.
#
# Runs on push and pull request so a bad catalog is caught before anyone's
# `plugin update` fetches it. scripts/validate-catalog.py also gates the size of
# .github/copilot-instructions.md and every .github/instructions/*.instructions.md file,
# and that every such file's applyTo glob(s) match a real file; its own --selftest runs
# immediately before its normal check, same as the two gates below.
#
# The same job also runs scripts/check-id-grammar.sh, the requirement-ID grammar
# gate: every ID a plugin doc teaches must be the Jira-safe bracketed [PREFIX#N]
# form, never the dash form that Jira auto-links to an unrelated ticket on paste.
# It is here rather than in a hook because a gate whose enforcement lives only in
# someone's memory is how the description-length rule regressed three times.
#
# It also runs scripts/check-docs.sh, which guards dev-workflows/docs/ against
# drift from the shipped plugin tree (links/anchors, orphan pages, command/agent/
# reference/hook inventories in both directions, env-var docs, table-cell width,
# and the getting-started.md install-block / identity-quarantine pin). Each gate's
# --selftest runs immediately before its --root check, in the same order: a gate
# that has stopped being able to fail must turn the build red, not green.
#
# Finally it runs scripts/mermaid/check-mermaid.mjs, ported from ai-workflows, which finds
# every ```mermaid block in every tracked markdown file with a real CommonMark lexer and
# parses it with mermaid's own parser. GitHub draws those fences as diagrams and shows
# "Unable to render rich display" where one does not parse, and nothing else here parsed
# mermaid (check-docs.sh check 15 reads diagrams only for which skills they name) -- in
# ai-workflows that blind spot shipped a workflow diagram with five unquoted edge labels
# that no gate saw, and a person found it by opening the page. The parser is pinned by
# exact version and a committed lockfile, as is the lexer, and both are installed with
# --ignore-scripts, so neither can change under the gate between two runs nor execute
# code when it installs.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json

      - name: Self-test the catalog and instruction-file gate
        run: python3 scripts/validate-catalog.py --selftest

      - name: Validate manifests and catalog
        run: python3 scripts/validate-catalog.py

      - name: Self-test the requirement-ID gate
        run: ./scripts/check-id-grammar.sh --selftest

      - name: Check requirement-ID grammar
        run: ./scripts/check-id-grammar.sh --root .

      - name: Self-test the docs gate
        run: ./scripts/check-docs.sh --selftest

      - name: Check docs against the plugin tree
        # ASSERT_PUBLISHED arms check 18 -- the one check that must NOT run everywhere. A
        # changelog section headed `— Unreleased` is the correct authoring state on a feature
        # branch and a false claim on the default branch, because `copilot plugin update` fetches
        # from there: whatever is on main is what users install. So it is armed exactly where the
        # claim is false, and a release branch stays green while it is still being written.
        # `github.ref` is the branch being pushed; on a pull_request event it is the merge ref,
        # never `refs/heads/main`, so the gate arms on the push that publishes and not on the
        # review that precedes it.
        env:
          ASSERT_PUBLISHED: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: ./scripts/check-docs.sh --root .

      - name: Install the mermaid gate's pinned parser
        run: npm ci --prefix scripts/mermaid --ignore-scripts --no-audit --no-fund
      - name: Self-test the mermaid gate
        run: node scripts/mermaid/check-mermaid.mjs --selftest
      - name: Check every mermaid diagram parses
        run: node scripts/mermaid/check-mermaid.mjs --root .
